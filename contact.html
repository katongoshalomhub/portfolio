<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Shalom Katongo</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Verdana, sans-serif;
    }

    body{
      background:
      linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
      url('https://wallpapers.com/images/hd/cyber-security-background-meuqfzxcg4gdd26s.jpg');
      background-size:cover;
      color:white;
    }

    header{
      background:#161b22;
      padding:20px;
    }

    nav{
      width:90%;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      color:#58a6ff;
      font-size:28px;
    }

    nav ul{
      display:flex;
      list-style:none;
    }

    nav ul li{
      margin-left:25px;
    }

    nav ul li a{
      text-decoration:none;
      color:white;
    }

    .contact-box{
      width:90%;
      max-width:650px;
      margin:70px auto;
      background:rgba(22,27,34,0.9);
      padding:50px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 0 25px rgba(88,166,255,0.4);
    }

    h2{
      margin-bottom:25px;
      color:#58a6ff;
      font-size:40px;
    }

    input,
    textarea{
      width:100%;
      padding:15px;
      margin:12px 0;
      border:none;
      border-radius:10px;
      background:#0d1117;
      color:white;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:30px;
      background:#58a6ff;
      color:white;
      font-size:17px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1f6feb;
    }

    #response{
      margin-top:20px;
      color:#58a6ff;
      font-weight:bold;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <h1 class="logo">Shalom Katongo</h1>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="contact-box">

  <h2>Get In Touch</h2>

  <form id="contactForm">

    <input type="text" placeholder="Enter your name" required>

    <input type="email" placeholder="Enter your email" required>

    <textarea rows="6" placeholder="Write your message" required></textarea>

    <button type="submit">
      Send Message
    </button>

  </form>

  <p id="response"></p>

</section>

<script>
  const contactForm =
  document.getElementById("contactForm");

  contactForm.addEventListener("submit",
  function(e){

    e.preventDefault();

    document.getElementById("response")
    .textContent =
    "Thank you for contacting Shalom Katongo.";

    contactForm.reset();

  });
</script>

</body>
</html>
