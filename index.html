<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shalom Katongo | Home</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Verdana, sans-serif;
    }

    body{
      background:
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      url('https://wallpapers.com/images/hd/cyber-security-background-meuqfzxcg4gdd26s.jpg');
      background-size:cover;
      background-position:center;
      color:white;
    }

    header{
      background:#0d1117;
      padding:20px;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:90%;
      margin:auto;
    }

    .logo{
      font-size:30px;
      color:#58a6ff;
    }

    nav ul{
      display:flex;
      list-style:none;
    }

    nav ul li{
      margin-left:25px;
    }

    nav ul li a{
      text-decoration:none;
      color:white;
      transition:0.3s;
    }

    nav ul li a:hover{
      color:#58a6ff;
    }

    .hero{
      min-height:90vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px;
    }

    .hero-box{
      background:rgba(13,17,23,0.85);
      padding:50px;
      border-radius:15px;
      text-align:center;
      max-width:750px;
      box-shadow:0 0 20px rgba(88,166,255,0.5);
    }

    .profile{
      width:160px;
      height:160px;
      object-fit:contain;
      background:white;
      padding:10px;
      border-radius:50%;
      margin-bottom:20px;
      border:4px solid #58a6ff;
    }

    h2{
      font-size:45px;
      margin-bottom:20px;
    }

    p{
      line-height:1.8;
      font-size:18px;
    }

    button{
      margin-top:25px;
      padding:14px 28px;
      border:none;
      border-radius:30px;
      background:#58a6ff;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1f6feb;
      transform:scale(1.05);
    }

    #message{
      margin-top:20px;
      color:#58a6ff;
      font-weight:bold;
      font-size:18px;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <h1 class="logo">Shalom Katongo</h1>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="hero">

  <div class="hero-box">

    <img
      src="https://sis.kmu.ac.zm/templates/mobile/images/header.png"
      class="profile"
      alt="Shalom Katongo"
    >

    <h2>Shalom Katongo</h2>

    <p>
      Future software developer with a strong passion for technology,
      cybersecurity, and creative web development.
    </p>

    <button id="btn">
      Discover More
    </button>

    <p id="message"></p>

  </div>

</section>

<script>
  const btn = document.getElementById("btn");

  btn.addEventListener("click", function(){

    document.getElementById("message").textContent =
    "Technology is best when it brings people together.";

  });
</script>

</body>
</html>
